name: UI screenshots

# Builds a Linux development player and runs it under Xvfb at phone resolutions. The player's
# screenshot runner (Assets/Scripts/Dev/UIScreenshotRunner.cs) presses through every screen and saves
# PNGs, uploaded as the "ui-screenshots" artifact. A simulated cutout and gesture bar make safe-area
# handling visible. Development builds show Unity's "Development Build" watermark; release APKs do not.

# Pull requests that touch the UI, or by hand. Not on every push: the run holds the shared Unity seat.
on:
  pull_request:
    paths:
      - 'Assets/Scripts/UI/**'
      - 'Assets/Resources/UI/**'
      - 'Assets/Art/**'
      - 'Assets/Scripts/Monetization/MonetizationOverlay.cs'
      - 'Assets/Scripts/Dev/UIScreenshotRunner.cs'
      - 'Assets/Editor/Snaploop/UIScreenshotBuild.cs'
      - '.github/workflows/ui-screenshots.yml'
  workflow_dispatch:

# Same rules as the Android build: a newer push replaces a run still waiting to start, manual runs are
# never replaced, and running jobs are never cancelled (killing Unity mid-build can leave the seat activated).
concurrency:
  group: ui-screenshots-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'auto' }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

env:
  SIZES: '1080x2400 720x1600'

jobs:
  screenshots:
    name: Capture UI screenshots
    runs-on: ubuntu-24.04
    # Up to SEAT_WAIT_MINUTES in the seat queue plus the build and capture.
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false

      - name: Check secrets
        id: check
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          if [ ! -f Assets/Editor/Snaploop/UIScreenshotBuild.cs ]; then
            echo "::notice::This branch has no screenshot build (Assets/Editor/Snaploop/UIScreenshotBuild.cs). Skipping UI screenshots."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          elif [ -z "$UNITY_EMAIL" ] || [ -z "$UNITY_PASSWORD" ]; then
            echo "::warning::Secrets UNITY_EMAIL and UNITY_PASSWORD are not available. Skipping UI screenshots. See docs/BUILD.md."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Free disk space
        if: steps.check.outputs.ready == 'true'
        uses: jlumbroso/free-disk-space@v2.0.0

      # Only the first two clips are needed (the puzzles the run plays); thumbnails are plain git files.
      - name: Pull the first clips from LFS
        if: steps.check.outputs.ready == 'true'
        run: |
          files=$(python3 -c "import json;l=json.load(open('Assets/StreamingAssets/Levels/levels.json'))['levels'][:2];print(','.join('Assets/StreamingAssets/Levels/'+x['file'] for x in l))")
          echo "LFS include: $files"
          git lfs pull --include="$files"

      - name: Restore Library cache
        if: steps.check.outputs.ready == 'true'
        uses: actions/cache@v6
        with:
          path: Library
          key: Library-StandaloneLinux64-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-StandaloneLinux64-

      # The Unity Personal seat is shared by every Unity job in the repo, so they take turns in the order
      # they started; nobody is cancelled. GitHub concurrency groups can't do this: they keep only one
      # waiting job and cancel the rest. Keep this step's env and script identical in android-build.yml and
      # ui-screenshots.yml; the job and step names below must cover every job that runs Unity.
      - name: Wait for the Unity seat
        if: steps.check.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SEAT_WAIT_MINUTES: 150
          SEAT_DEFS: |
            def seat_job: .status == "in_progress" and (.name == "Build Android" or .name == "Capture UI screenshots");
            def seat_step: .name == "Build with Unity" or .name == "Build Linux player";
          # This job: matched by runner name, else the run's only in-progress Unity job.
          SEAT_SELF: |
            [.jobs[] | select(.runner_name == env.RUNNER_NAME)] as $mine
            | (if ($mine | length) == 1 then $mine else [.jobs[] | select(seat_job)] end)
            | select(length == 1) | .[0] | "\(.started_at) \(.id)"
          # Unity jobs that started before this one and haven't finished their Unity step.
          SEAT_HOLDERS: |
            .jobs[]
            | select(seat_job and .id != (env.MY_ID | tonumber))
            | select(.started_at < env.MY_START or (.started_at == env.MY_START and .id < (env.MY_ID | tonumber)))
            | select(any(.steps[]?; seat_step and .status == "completed") | not)
            | "\(.name): \(.html_url)"
        run: |
          api() { gh api -H "X-GitHub-Api-Version: 2022-11-28" "$@"; }
          for _ in 1 2 3 4 5 6; do
            me=$(api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" \
              --jq "$SEAT_DEFS $SEAT_SELF") && [ -n "$me" ] && break
            sleep 10
          done
          [ -n "${me:-}" ] || { echo "::error::Could not look up this job through the Actions API."; exit 1; }
          read -r MY_START MY_ID <<< "$me"
          export MY_START MY_ID

          start=$(date +%s)
          deadline=$(( start + SEAT_WAIT_MINUTES * 60 ))
          while :; do
            ahead="" ok=true
            # Only runs that started before this job can contain a job that did.
            if runs=$(api "repos/$GITHUB_REPOSITORY/actions/runs?status=in_progress&per_page=100" \
                --jq ".workflow_runs[] | select(.run_started_at <= \"$MY_START\") | \"\(.id) \(.run_attempt)\""); then
              while read -r run attempt; do
                [ -n "$run" ] || continue
                holders=$(api "repos/$GITHUB_REPOSITORY/actions/runs/$run/attempts/$attempt/jobs?per_page=100" --jq "$SEAT_DEFS $SEAT_HOLDERS") \
                  || { ok=false; break; }
                if [ -n "$holders" ]; then ahead+="$holders"$'\n'; fi
              done <<< "$runs"
            else
              ok=false
            fi

            if $ok && [ -z "$ahead" ]; then break; fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::Gave up after waiting ${SEAT_WAIT_MINUTES} minutes for the Unity seat. Still ahead:"
              printf '%s' "$ahead"
              exit 1
            fi
            if $ok; then
              echo "$(date -u +%H:%M:%S) Waiting for the Unity seat, ahead of this job:"
              printf '%s' "$ahead" | sed 's/^/  /'
            else
              echo "$(date -u +%H:%M:%S) Actions API call failed; treating the seat as taken and retrying."
            fi
            sleep 60
          done

          waited=$(( ($(date +%s) - start) / 60 ))
          echo "Unity seat is free (waited ${waited} min)."
          [ "$waited" -eq 0 ] || echo "Waited ${waited} min for the shared Unity seat." >> "$GITHUB_STEP_SUMMARY"

      - name: Build Linux player
        if: steps.check.outputs.ready == 'true'
        uses: game-ci/unity-builder@v6
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          cliVersion: v0.1.72
          targetPlatform: StandaloneLinux64
          buildMethod: Snaploop.EditorTools.UIScreenshotBuild.BuildFromCommandLine
          buildName: Snaploop
          versioning: None

      - name: Install Xvfb, Mesa and ffmpeg
        if: steps.check.outputs.ready == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends xvfb xauth ffmpeg libgl1 libgl1-mesa-dri libglu1-mesa \
            libxcursor1 libxrandr2 libxi6 libxinerama1 libxss1 > /dev/null

      # Linux players cannot decode H.264, so the played clips are re-encoded to VP8 WebM inside the
      # built player only (the repo and the APK keep the MP4s).
      - name: Prepare player
        id: player
        if: steps.check.outputs.ready == 'true'
        run: |
          sudo chown -R "$(id -u):$(id -g)" build
          exe=$(find build -name '*.x86_64' -type f | head -n 1)
          [ -n "$exe" ] || { echo "::error::No Linux player found under build/"; find build -maxdepth 3; exit 1; }
          chmod +x "$exe"
          levels="${exe%.x86_64}_Data/StreamingAssets/Levels"
          python3 - "$levels" <<'EOF'
          import json, subprocess, sys
          levels_dir = sys.argv[1]
          manifest = levels_dir + "/levels.json"
          data = json.load(open(manifest))
          for level in data["levels"][:2]:
              src = "Assets/StreamingAssets/Levels/" + level["file"]
              out = level["id"] + ".webm"
              subprocess.run(["ffmpeg", "-loglevel", "error", "-y", "-i", src, "-an", "-c:v", "libvpx", "-b:v", "2M",
                              "-deadline", "realtime", "-cpu-used", "8", levels_dir + "/" + out], check=True)
              level["file"] = out
              print("re-encoded", src, "->", out)
          json.dump(data, open(manifest, "w"), indent=2)
          EOF
          echo "exe=$exe" >> "$GITHUB_OUTPUT"

      - name: Capture screenshots
        if: steps.check.outputs.ready == 'true'
        env:
          EXE: ${{ steps.player.outputs.exe }}
        run: |
          mkdir -p screenshots logs
          for size in $SIZES; do
            w=${size%x*}; h=${size#*x}
            out="$PWD/screenshots/$size"
            mkdir -p "$out"
            # Fresh HOME per run: first-launch state (onboarding, ad grace) every time.
            fresh_home=$(mktemp -d)
            echo "::group::Player $size"
            # The player switches to its own folder, so the log path must be absolute.
            HOME="$fresh_home" timeout 480 xvfb-run -a -s "-screen 0 ${w}x${h}x24" "$EXE" \
              -screen-fullscreen 0 -screen-width "$w" -screen-height "$h" -force-glcore \
              -logFile "$PWD/logs/player-$size.log" -snaploop-screenshots "$out" -snaploop-size "$size" \
              || echo "::warning::Player exited with status $? at $size (see logs/player-$size.log)"
            # Step results, plus a few stack lines under each exception the runner forwarded.
            grep -E -A4 '^\[Screenshots\] (exception|.* threw)' "logs/player-$size.log" || true
            grep -E '^\[Screenshots\] (saved|skipped|no button|done|screen|watchdog)' "logs/player-$size.log" || true
            echo "::endgroup::"
          done
          count=$(find screenshots -name '*.png' | wc -l)
          {
            echo "### UI screenshots"
            echo ""
            echo "Download the **ui-screenshots** artifact from this run's summary page."
            echo ""
            for size in $SIZES; do
              echo "- $size: $(ls screenshots/$size 2>/dev/null | tr '\n' ' ')"
            done
          } >> "$GITHUB_STEP_SUMMARY"
          [ "$count" -gt 0 ] || { echo "::error::No screenshots were captured."; tail -n 80 logs/*.log; exit 1; }

      - name: Upload screenshots
        if: always() && steps.check.outputs.ready == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ui-screenshots
          path: |
            screenshots/
            logs/
          if-no-files-found: warn
          retention-days: 30
